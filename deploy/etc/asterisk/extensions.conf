; Qvadis - dialplan del llamador (sin mensajes, sin buzon)
[general]
static=yes
writeprotect=no

[globals]
; Grupo de llamada por defecto (solo panel); el manager lo amplia con los moviles emparejados
QV_RING=PJSIP/1000
#tryinclude "/var/lib/qvadis/globals.conf"

[qvadis]
; Llamada de la placa de calle -> suena en panel + moviles emparejados; atender en cualquiera
exten => door,1,Set(CALLERID(name)=Puerta)
 same => n,Dial(${QV_RING},45)
 same => n,Hangup()

; Marcado directo al panel
exten => 1000,1,Dial(PJSIP/1000,30)
 same => n,Hangup()

; SOLO BANCO: 600 = audio de la placa de calle simulado (eco de loopback, NO es un mensaje)
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Qvadis - PJSIP minimo (videoportero sin nube, LAN)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TLS para los moviles remotos (audio SRTP). Cert autofirmado (la app lo fija por pinning).
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/qvadis.crt
priv_key_file=/etc/asterisk/keys/qvadis.key
method=tlsv1_2

;=================== 1000 (panel / baresip) ===================
[1000]
type=endpoint
context=qvadis
disallow=all
allow=ulaw,alaw
auth=1000
aors=1000
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[1000]
type=auth
auth_type=userpass
username=1000
password=CHANGE_ME

[1000]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; Moviles emparejados desde la UI (lo genera el manager: cada emparejamiento crea su cuenta)
#tryinclude "/var/lib/qvadis/pjsip_mobiles.conf"

# Bluetooth del rtl8723bu DESHABILITADO a propósito.
# Es un combo WiFi+BT (2.4 GHz, antena/radio compartida): con el BT activo la
# coexistencia degrada y llega a tirar el WiFi. El videoportero no usa Bluetooth,
# así que se bloquea su carga para dar toda la radio al WiFi (más estable).
blacklist btusb

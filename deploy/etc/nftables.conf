#!/usr/sbin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    udp dport 68 accept            # cliente DHCP (renovar IP)
    tcp dport 22 ct state new accept                 # SSH (solo LAN; el 22 nunca se reenvia)
    tcp dport { 5061, 8443 } ct state new accept      # SIP-TLS + HTTPS (expuestos por port-forward)
    udp dport 5060 accept                             # SIP UDP (panel/LAN)
    udp dport 10000-10020 accept                      # RTP (rango mínimo, audio de llamadas)
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}

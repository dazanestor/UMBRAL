# Asterisk 20 con PJSIP registra los intentos fallidos asi (NOTICE en messages.log):
#   Request 'REGISTER' from '<sip:1001@dominio>' failed for '1.2.3.4:5060' (callid: ...) - Failed to authenticate
#   Request 'OPTIONS' from '<sip:scan@x>' failed for '1.2.3.4:5060' (callid: ...) - No matching endpoint found
# El filtro "asterisk" que trae fail2ban espera el formato antiguo (chan_sip) y no detecta nada de esto.
[Definition]
datepattern = ^\[%%b %%d %%H:%%M:%%S\]
failregex = ^\s*NOTICE\[\d+\] \S+: Request '\w+' from '[^']*' failed for '<HOST>:\d+' \(callid: [^)]*\) - (?:Failed to authenticate|No matching endpoint found|Challenge response is not valid)
ignoreregex =
